version: "3.9"

services:

  # ─── Spring Boot API ─────────────────────────────────────────────────────
  census-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: census-api
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      IDENTITY_DB_URL:   jdbc:postgresql://identity-db:5432/identity
      CENSUS_DB_URL:     jdbc:postgresql://census-db:5432/census
      AUDIT_DB_URL:      jdbc:postgresql://census-db:5432/census
      DB_USERNAME:       census
      DB_PASSWORD:       devpassword
      REDIS_URL:         redis://redis:6379
      REDIS_PASSWORD:    ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # ── Crypto (dev only — change in production) ──
      JWT_SECRET:          "dev-jwt-secret-must-be-at-least-32-characters-long!"
      GLOBAL_PHONE_SALT:   "dev-global-phone-salt-change-in-prod"
      ENCRYPTION_KEY:      "dev-encryption-key-32chars!!!!!!"
      HMAC_SECRET:         "dev-hmac-secret-change-in-production"
      # ── Face service (mock in dev) ──
      FACE_MODEL_SERVICE_URL: http://localhost:8081
      # ── Twilio (stub in dev) ──
      TWILIO_ACCOUNT_SID:  "ACdevtest000000000000000000000000"
      TWILIO_AUTH_TOKEN:   "devtoken00000000000000000000000000"
      TWILIO_FROM_NUMBER:  "+15005550006"
      # ── Spring Boot ──
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_API_DOCS: "true"
    depends_on:
      identity-db:
        condition: service_healthy
      census-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - census-net
    restart: unless-stopped

  # ─── Identity Database ────────────────────────────────────────────────────
  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB:       identity
      POSTGRES_USER:     census
      POSTGRES_PASSWORD: devpassword
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U census -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - census-net

  # ─── Census (Demographic) Database ────────────────────────────────────────
  census-db:
    image: postgres:16-alpine
    container_name: census-db
    environment:
      POSTGRES_DB:       census
      POSTGRES_USER:     census
      POSTGRES_PASSWORD: devpassword
    volumes:
      - census-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U census -d census"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - census-net

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: census-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - census-net

  # ─── Kafka + Zookeeper ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - census-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: census-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - census-net

volumes:
  identity-db-data:
  census-db-data:
  redis-data:

networks:
  census-net:
    driver: bridge
