spring:
  application:
    name: census-platform

  # ─── Datasource (Identity DB) ────────────────────────────────────────────
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USERNAME:census}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: IdentityPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  # ─── Flyway Migrations ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Redis ───────────────────────────────────────────────────────────────
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 5000ms

  # ─── Kafka ───────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: census-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    topics:
      audit: census.audit.events
      fraud: census.fraud.alerts
      sync: census.offline.sync

  # ─── Security ────────────────────────────────────────────────────────────
  security:
    require-ssl: true

# ─── Census Platform Config ──────────────────────────────────────────────────
census:
  security:
    jwt:
      secret: ${JWT_SECRET}
      session-ttl-minutes: 10      # Short-lived session tokens
    otp:
      ttl-seconds: 300
      max-attempts: 3
      rate-limit-window-seconds: 600
      rate-limit-max-requests: 5
    crypto:
      global-phone-salt: ${GLOBAL_PHONE_SALT}
      encryption-key: ${ENCRYPTION_KEY}
      hmac-secret: ${HMAC_SECRET}
  face:
    similarity-threshold: 0.85
    liveness-threshold: 0.92
    model-service-url: ${FACE_MODEL_SERVICE_URL:http://face-service:8080}
  fraud:
    block-threshold: 0.85
    review-threshold: 0.70
  census:
    id: "CENSUS-2026"
    k-anonymity-threshold: 100
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER}

# ─── Resilience4j ────────────────────────────────────────────────────────────
resilience4j:
  ratelimiter:
    instances:
      otp-send:
        limit-for-period: 5
        limit-refresh-period: 10m
        timeout-duration: 0
      census-submit:
        limit-for-period: 3
        limit-refresh-period: 1h
        timeout-duration: 0
  circuitbreaker:
    instances:
      face-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      twilio:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s

# ─── Actuator / Monitoring ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never       # Never expose internals publicly
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: census-platform
      environment: ${ENVIRONMENT:production}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    gov.census: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: never       # Never expose stack traces
    include-stacktrace: never
    include-exception: false
  http2:
    enabled: true
  shutdown: graceful
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 20000

# ─── SpringDoc ───────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    enabled: ${ENABLE_API_DOCS:false}     # Disabled in production
  swagger-ui:
    enabled: ${ENABLE_API_DOCS:false}
